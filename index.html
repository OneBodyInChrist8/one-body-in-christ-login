
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONE BODY IN CHRIST</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f7;
      text-align: center;
      padding: 30px 15px;
    }

    .box {
      background: white;
      padding: 25px 18px;
      border-radius: 15px;
      max-width: 420px;
      margin: 30px auto;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #aaa;
    }

    button {
      background: #203e75;
      color: white;
      border: none;
    }

    #message {
      color: #203e75;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
<div class="box">

  <h2>ONE BODY IN CHRIST</h2>
  <p>Member Login</p>

  <input id="email" type="email"
    placeholder="Enter Email Address">

  <input id="password" type="password"
    placeholder="Enter Password">

  <button onclick="createAccount()">CREATE ACCOUNT</button>

  <button onclick="login()">LOGIN</button>

  <button onclick="logout()">LOGOUT</button>

  <p id="message"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHtGZN-zKoXkC3ChgqTPvKYjQ8jMLF5Z8",
  authDomain: "onebodyinchrist-a5066.firebaseapp.com",
  projectId: "onebodyinchrist-a5066",
  storageBucket: "onebodyinchrist-a5066.firebasestorage.app",
  messagingSenderId: "1017118183484",
  appId: "1:1017118183484:web:91d9ed3b45113035ad7339"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function getDetails() {
  return {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
    message: document.getElementById("message")
  };
}

async function createAccount() {
  const d = getDetails();

  try {
    await auth.createUserWithEmailAndPassword(
      d.email, d.password
    );
    d.message.innerText = "Account created successfully!";
  } catch (error) {
    d.message.innerText = error.message;
  }
}

async function login() {
  const d = getDetails();

  try {
    await auth.signInWithEmailAndPassword(
      d.email, d.password
    );
    d.message.innerText = "Login successful!";
  } catch (error) {
    d.message.innerText = error.message;
  }
}

async function logout() {
  try {
    await auth.signOut();
    document.getElementById("message").innerText =
      "You have logged out.";
  } catch (error) {
    document.getElementById("message").innerText =
      error.message;
  }
}
</script>

</body>
</html>
