
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE BODY IN CHRIST</title>
<style>
body{font-family:Arial;background:#f0f2f7;text-align:center;padding:15px}
.box{background:white;max-width:550px;margin:25px auto;padding:22px;border-radius:16px}
input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:9px}
input,textarea{border:1px solid #aaa}
button{background:#194477;color:white;border:0;cursor:pointer}
.hidden{display:none}
.request{background:#f1f3f7;padding:12px;margin:12px 0;border-radius:10px;text-align:left;overflow-wrap:anywhere}
.small{font-size:13px;color:#555}
</style>
</head>
<body>

<div class="box">
<h1>ONE BODY IN CHRIST</h1>

<div id="loginBox">
<h2>Member Login</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button onclick="createAccount()">CREATE ACCOUNT</button>
<button onclick="login()">LOGIN</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<h2>Member Dashboard</h2>
<p id="welcome"></p>

<button onclick="openMeeting()">JOIN LIVE MEETING</button>

<div id="meetingBox" class="hidden">
<h2>ONE BODY IN CHRIST LIVE</h2>
<div id="jitsi-container" style="width:100%;height:500px;"></div>

<button onclick="requestToSpeak()">REQUEST TO SPEAK</button>
<p id="speakStatus"></p>

<button onclick="closeMeeting()">CLOSE MEETING</button>
</div>

<button onclick="showPrayer()">PRAYER REQUEST</button>

<div id="prayerBox" class="hidden">
<h3>Send Your Prayer Request</h3>
<textarea id="prayer" rows="4" placeholder="Write your prayer request"></textarea>
<button onclick="sendPrayer()">SUBMIT PRAYER REQUEST</button>
<p id="prayerMessage"></p>
</div>

<button onclick="alert('Meeting schedule will be added soon.')">MEETING SCHEDULE</button>
<button onclick="alert('Bible Message: Matthew 18:20')">BIBLE MESSAGES</button>

<div id="adminBox" class="hidden">
<hr>
<h2>Admin Dashboard</h2>

<h3>Prayer Requests</h3>
<button onclick="loadRequests()">VIEW PRAYER REQUESTS</button>
<div id="requests"></div>

<hr>

<h3>Speaking Requests</h3>
<button onclick="loadSpeakingRequests()">VIEW SPEAKING REQUESTS</button>
<div id="speakingRequests"></div>
</div>

<button onclick="logout()">LOGOUT</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://meet.jit.si/external_api.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHtGZN-zKoXkC3ChgqTPvKYjQ8jMLF5Z8",
  authDomain: "onebodyinchrist-a5066.firebaseapp.com",
  projectId: "onebodyinchrist-a5066",
  storageBucket: "onebodyinchrist-a5066.firebasestorage.app",
  messagingSenderId: "1017118183484",
  appId: "1:1017118183484:web:91d9ed3b45113035ad7339"
};

const ADMIN_UID = "ZMMVJGQDO7PgM96neKdoEJwRJVy1";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let jitsiApi = null;
let speakingRequestUnsubscribe = null;

function createAccount() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email,password)
    .catch(e => document.getElementById("message").innerText = e.message);
}

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,password)
    .catch(e => document.getElementById("message").innerText = e.message);
}

function logout() {
  closeMeeting();

  if (speakingRequestUnsubscribe) {
    speakingRequestUnsubscribe();
    speakingRequestUnsubscribe = null;
  }

  auth.signOut();
}

function showPrayer() {
  document.getElementById("prayerBox").classList.toggle("hidden");
}

async function sendPrayer() {
  const user = auth.currentUser;
  const message = document.getElementById("prayer").value.trim();
  const output = document.getElementById("prayerMessage");

  if (!user) {
    output.innerText = "Please login first.";
    return;
  }

  if (!message || message.length > 2000) {
    output.innerText = "Please enter a request (maximum 2000 characters).";
    return;
  }

  try {
    await db.collection("prayerRequests").add({
      message: message,
      status: "pending",
      userId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("prayer").value = "";
    output.innerText = "Your prayer request was sent successfully. God bless you!";

  } catch (e) {
    output.innerText = "Could not send request: " + e.message;
  }
}

async function loadRequests() {
  const area = document.getElementById("requests");
  area.textContent = "Loading prayer requests...";

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    area.textContent = "Admin access only.";
    return;
  }

  try {
    const snapshot = await db.collection("prayerRequests").get();
    area.replaceChildren();

    if (snapshot.empty) {
      area.textContent = "No prayer requests yet.";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement("div");
      card.className = "request";

      const message = document.createElement("p");
      message.textContent = data.message || "(No message)";
      card.appendChild(message);

      const status = document.createElement("p");
      status.className = "small";
      status.textContent = "Status: " + (data.status || "unknown");
      card.appendChild(status);

      const user = document.createElement("p");
      user.className = "small";
      user.textContent = "Member UID: " + (data.userId || "Not available");
      card.appendChild(user);

      if (data.status !== "prayed") {
        const btn = document.createElement("button");
        btn.textContent = "MARK AS PRAYED";
        btn.onclick = () => markPrayed(doc.id);
        card.appendChild(btn);
      }

      area.appendChild(card);
    });

  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}

async function markPrayed(id) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin access only.");
    return;
  }

  try {
    await db.collection("prayerRequests").doc(id).update({
      status: "prayed"
    });

    loadRequests();

  } catch (e) {
    alert("Could not update: " + e.message);
  }
}

// MEMBER REQUEST TO SPEAK

async function requestToSpeak() {
  const user = auth.currentUser;
  const output = document.getElementById("speakStatus");

  if (!user) {
    output.innerText = "Please login first.";
    return;
  }

  output.innerText = "Sending your speaking request...";

  try {
    const ref = await db.collection("speakingRequests").add({
      userId: user.uid,
      userName: user.displayName || user.email || "Member",
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    if (speakingRequestUnsubscribe) {
      speakingRequestUnsubscribe();
    }

    output.innerText = "Your request has been sent. Waiting for Admin approval.";

    speakingRequestUnsubscribe = db.collection("speakingRequests")
      .doc(ref.id)
      .onSnapshot(doc => {
        if (doc.exists) {
          const status = doc.data().status;

          if (status === "approved") {
            output.innerText = "Your speaking request has been APPROVED by Admin.";
          } else if (status === "denied") {
            output.innerText = "Your speaking request was DENIED by Admin.";
          } else {
            output.innerText = "Your speaking request is PENDING.";
          }
        }
      }, error => {
        output.innerText = "Status error: " + error.message;
      });

  } catch (e) {
    output.innerText = "Could not send request: " + e.message;
  }
}

// ADMIN VIEW SPEAKING REQUESTS

async function loadSpeakingRequests() {
  const area = document.getElementById("speakingRequests");
  area.textContent = "Loading speaking requests...";

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    area.textContent = "Admin access only.";
    return;
  }

  try {
    const snapshot = await db.collection("speakingRequests").get();
    area.replaceChildren();

    if (snapshot.empty) {
      area.textContent = "No speaking requests yet.";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement("div");
      card.className = "request";

      const name = document.createElement("p");
      name.textContent = "Member: " + (data.userName || "Unknown");
      card.appendChild(name);

      const status = document.createElement("p");
      status.textContent = "Status: " + (data.status || "unknown");
      card.appendChild(status);

      const uid = document.createElement("p");
      uid.className = "small";
      uid.textContent = "Member UID: " + (data.userId || "Not available");
      card.appendChild(uid);

      if (data.status === "pending") {
        const approve = document.createElement("button");
        approve.textContent = "APPROVE";
        approve.onclick = () => setSpeakingStatus(doc.id, "approved");
        card.appendChild(approve);

        const deny = document.createElement("button");
        deny.textContent = "DENY";
        deny.onclick = () => setSpeakingStatus(doc.id, "denied");
        card.appendChild(deny);
      }

      area.appendChild(card);
    });

  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}

async function setSpeakingStatus(id, status) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin access only.");
    return;
  }

  if (status !== "approved" && status !== "denied") {
    return;
  }

  try {
    await db.collection("speakingRequests").doc(id).update({
      status: status
    });

    loadSpeakingRequests();

  } catch (e) {
    alert("Could not update request: " + e.message);
  }
}

// LIVE MEETING

function openMeeting() {
  document.getElementById("meetingBox").classList.remove("hidden");

  if (typeof JitsiMeetExternalAPI === "undefined") {
    alert("Video meeting service did not load. Please refresh and try again.");
    return;
  }

  if (jitsiApi) return;

  try {
    jitsiApi = new JitsiMeetExternalAPI("meet.jit.si", {
      roomName: "OneBodyInChristPrayerMeetingTest2026",
      parentNode: document.getElementById("jitsi-container"),
      width: "100%",
      height: 500,
      configOverwrite: {
        prejoinPageEnabled: true
      }
    });
  } catch (e) {
    alert("Meeting could not open: " + e.message);
  }
}

function closeMeeting() {
  if (jitsiApi) {
    jitsiApi.dispose();
    jitsiApi = null;
  }

  document.getElementById("jitsi-container").innerHTML = "";
  document.getElementById("meetingBox").classList.add("hidden");
}

// LOGIN STATE

auth.onAuthStateChanged(user => {
  document.getElementById("loginBox").classList.toggle("hidden", !!user);
  document.getElementById("dashboard").classList.toggle("hidden", !user);

  if (user) {
    document.getElementById("welcome").textContent = "Welcome, " + user.email;

    const isAdmin = user.uid === ADMIN_UID;
    document.getElementById("adminBox").classList.toggle("hidden", !isAdmin);

  } else {
    document.getElementById("adminBox").classList.add("hidden");
    document.getElementById("meetingBox").classList.add("hidden");
    document.getElementById("prayerBox").classList.add("hidden");
  }
});
</script>

</body>
</html>
