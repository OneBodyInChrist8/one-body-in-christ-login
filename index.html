
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONE BODY IN CHRIST</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      text-align: center;
      padding: 25px 12px;
    }
    .box {
      background: white;
      max-width: 500px;
      margin: 35px auto;
      padding: 30px 20px;
      border-radius: 20px;
    }
    input, button, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      font-size: 18px;
      border-radius: 10px;
    }
    input, textarea {
      border: 1px solid #aaa;
    }
    button {
      background: #194477;
      color: white;
      border: none;
      cursor: pointer;
    }
    .hidden { display: none; }
    h1 { font-size: 30px; }
  </style>
</head>
<body>

<div class="box">
  <h1>ONE BODY IN CHRIST</h1>

  <div id="loginBox">
    <h2>Member Login</h2>
    <input id="email" type="email" placeholder="Enter Email Address">
    <input id="password" type="password" placeholder="Enter Password">
    <button onclick="createAccount()">CREATE ACCOUNT</button>
    <button onclick="login()">LOGIN</button>
    <p id="message"></p>
  </div>

  <div id="dashboard" class="hidden">
    <h2>Member Dashboard</h2>
    <button onclick="alert('Live Meeting link will be added soon.')">JOIN LIVE MEETING</button>
    <button onclick="showPrayer()">PRAYER REQUEST</button>
    <div id="prayerBox" class="hidden">
      <textarea id="prayer" placeholder="Write your prayer request"></textarea>
      <button onclick="sendPrayer()">SUBMIT PRAYER REQUEST</button>
      <p id="prayerMessage"></p>
    </div>
    <button onclick="alert('Meeting schedule will be added soon.')">MEETING SCHEDULE</button>
    <button onclick="alert('Bible Message: Matthew 18:20')">BIBLE MESSAGES</button>
    <button onclick="logout()">LOGOUT</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHtGZN-zKoXkC3ChgqTPvKYjQ8jMLF5Z8",
  authDomain: "onebodyinchrist-a5066.firebaseapp.com",
  projectId: "onebodyinchrist-a5066",
  storageBucket: "onebodyinchrist-a5066.firebasestorage.app",
  messagingSenderId: "1017118183484",
  appId: "1:1017118183484:web:91d9ed3b45113035ad7339"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function createAccount() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .catch(error => {
      document.getElementById("message").innerText = error.message;
    });
}

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .catch(error => {
      document.getElementById("message").innerText = error.message;
    });
}

function logout() {
  auth.signOut();
}

function showPrayer() {
  document.getElementById("prayerBox").classList.toggle("hidden");
}

function sendPrayer() {
  const prayer = document.getElementById("prayer").value.trim();
  document.getElementById("prayerMessage").innerText =
    prayer ? "Your prayer request has been entered. Saving feature will be added later." :
    "Please write your prayer request.";
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
  }
});
</script>

</body>
</html>
