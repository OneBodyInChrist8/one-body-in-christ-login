
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONE BODY IN CHRIST</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
      padding: 25px 12px;
    }
    .box {
      background: white;
      padding: 25px 18px;
      border-radius: 14px;
      max-width: 400px;
      margin: 35px auto;
    }
    h2 { color: #263b70; }
    input {
      width: 90%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #aaa;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 96%;
      padding: 14px;
      margin: 10px 0;
      background: #263b70;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }
    #message { color: #263b70; }
  </style>
</head>
<body>
<div class="box">
  <h2>ONE BODY IN CHRIST</h2>
  <p>Member Login</p>

  <input id="phone" type="tel"
    placeholder="Mobile number e.g. +919876543210">

  <div id="recaptcha-container"></div>

  <button id="send" onclick="sendOTP()">SEND OTP</button>

  <input id="otp" type="text"
    placeholder="Enter OTP">

  <button onclick="verifyOTP()">VERIFY OTP</button>

  <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHtGZN-zKoXkC3ChgqTPvKYjQ8jMLF5Z8",
  authDomain: "onebodyinchrist-a5066.firebaseapp.com",
  projectId: "onebodyinchrist-a5066",
  storageBucket: "onebodyinchrist-a5066.firebasestorage.app",
  messagingSenderId: "1017118183484",
  appId: "1:1017118183484:web:91d9ed3b45113035ad7339"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let confirmationResult;

const verifier = new firebase.auth.RecaptchaVerifier(
  "recaptcha-container",
  { size: "normal" }
);

verifier.render();

async function sendOTP() {
  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message");

  if (!phone.startsWith("+")) {
    message.innerText = "Enter country code, e.g. +91";
    return;
  }

  try {
    confirmationResult =
      await auth.signInWithPhoneNumber(phone, verifier);
    message.innerText = "OTP sent successfully!";
  } catch (error) {
    message.innerText = error.message;
  }
}

async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();

  try {
    const result = await confirmationResult.confirm(otp);
    message.innerText = "Login successful! Welcome.";
  } catch (error) {
    message.innerText = "OTP verification failed. Try again.";
  }
}
</script>
</body>
</html>
