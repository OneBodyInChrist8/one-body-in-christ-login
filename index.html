
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE BODY IN CHRIST</title>
<style>
body{font-family:Arial;background:#f0f2f7;text-align:center;padding:15px}
.box{background:white;max-width:550px;margin:25px auto;padding:22px;border-radius:16px}
input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:9px}
input,textarea{border:1px solid #aaa}
button{background:#194477;color:white;border:0;cursor:pointer}
.hidden{display:none}
.request{background:#f1f3f7;padding:12px;margin:12px 0;border-radius:10px;text-align:left;overflow-wrap:anywhere}
.small{font-size:13px;color:#555}
.meeting-id{font-size:24px;overflow-wrap:anywhere;color:#194477}
</style>
</head>
<body>

<div class="box">
<h1>ONE BODY IN CHRIST</h1>

<div id="loginBox">
<h2>Member Login</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button onclick="createAccount()">CREATE ACCOUNT</button>
<button onclick="login()">LOGIN</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<h2>Member Dashboard</h2>
<p id="welcome"></p>

<hr>
<h2>LIVE MEETING</h2>

<button onclick="createMeeting()">CREATE MEETING</button>

<div id="meetingInfo" class="hidden">
<p>Your Meeting ID:</p>
<h2 id="meetingIdDisplay" class="meeting-id"></h2>
<button onclick="shareMeeting()">SHARE MEETING LINK</button>
</div>

<div id="joinMeetingBox">
<h3>Join a Meeting</h3>
<input id="meetingIdInput" placeholder="Enter Meeting ID">
<button onclick="joinMeeting()">JOIN MEETING</button>
</div>

<div id="meetingBox" class="hidden">
<h2>ONE BODY IN CHRIST LIVE</h2>
<p>Meeting ID: <strong id="activeMeetingDisplay"></strong></p>
<div id="jitsi-container" style="width:100%;height:500px;"></div>
<button onclick="requestToSpeak()">REQUEST TO SPEAK</button>
<p id="speakStatus"></p>
<button onclick="closeMeeting()">CLOSE MEETING</button>
</div>

<hr>
<button onclick="showPrayer()">PRAYER REQUEST</button>

<div id="prayerBox" class="hidden">
<h3>Send Your Prayer Request</h3>
<textarea id="prayer" rows="4" placeholder="Write your prayer request"></textarea>
<button onclick="sendPrayer()">SUBMIT PRAYER REQUEST</button>
<p id="prayerMessage"></p>
</div>

<button onclick="alert('Meeting schedule will be added soon.')">MEETING SCHEDULE</button>
<button onclick="alert('Bible Message: Matthew 18:20')">BIBLE MESSAGES</button>

<div id="adminBox" class="hidden">
<hr>
<h2>Admin Dashboard</h2>
<h3>Prayer Requests</h3>
<button onclick="loadRequests()">VIEW PRAYER REQUESTS</button>
<div id="requests"></div>

<hr>
<h3>Speaking Requests</h3>
<button onclick="loadSpeakingRequests()">VIEW SPEAKING REQUESTS</button>
<div id="speakingRequests"></div>
</div>

<div id="hostTools" class="hidden">
<hr>
<h2>HOST CONTROL</h2>
<h3>Make a Member Host</h3>
<input id="newHostUID" placeholder="Enter Member UID">
<input id="newHostName" placeholder="Enter Member Name">
<button onclick="makeHost()">MAKE HOST</button>
<p id="hostMessage"></p>

<h3>Current Hosts</h3>
<button onclick="loadHosts()">VIEW HOSTS</button>
<div id="hostList"></div>
</div>

<button onclick="logout()">LOGOUT</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://meet.jit.si/external_api.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHtGZN-zKoXkC3ChgqTPvKYjQ8jMLF5Z8",
  authDomain: "onebodyinchrist-a5066.firebaseapp.com",
  projectId: "onebodyinchrist-a5066",
  storageBucket: "onebodyinchrist-a5066.firebasestorage.app",
  messagingSenderId: "1017118183484",
  appId: "1:1017118183484:web:91d9ed3b45113035ad7339"
};

const ADMIN_UID = "ZMMVJGQDO7PgM96neKdoEJwRJVy1";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let jitsiApi = null;
let speakingRequestUnsubscribe = null;
let currentIsAdmin = false;
let currentIsHost = false;
let activeMeetingId = "";

// ACCOUNT

function createAccount() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email,password)
    .catch(e => document.getElementById("message").innerText = e.message);
}

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,password)
    .catch(e => document.getElementById("message").innerText = e.message);
}

function logout() {
  closeMeeting();

  if (speakingRequestUnsubscribe) {
    speakingRequestUnsubscribe();
    speakingRequestUnsubscribe = null;
  }

  auth.signOut();
}

// MEETING SYSTEM

function generateMeetingId() {
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);

  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2,"0"))
    .join("")
    .toUpperCase();
}

function createMeeting() {
  if (!auth.currentUser) {
    alert("Please login first.");
    return;
  }

  const meetingId = generateMeetingId();

  document.getElementById("meetingIdDisplay").innerText = meetingId;
  document.getElementById("meetingIdInput").value = meetingId;
  document.getElementById("meetingInfo").classList.remove("hidden");

  startMeeting(meetingId);
}

function joinMeeting() {
  if (!auth.currentUser) {
    alert("Please login first.");
    return;
  }

  const meetingId = document.getElementById("meetingIdInput")
    .value.trim().replace(/\s/g,"").toUpperCase();

  if (!/^[A-F0-9]{12}$/.test(meetingId)) {
    alert("Please enter a valid 12-character Meeting ID.");
    return;
  }

  startMeeting(meetingId);
}

function startMeeting(meetingId) {
  if (typeof JitsiMeetExternalAPI === "undefined") {
    alert("Video meeting service did not load. Please refresh and try again.");
    return;
  }

  if (jitsiApi) {
    jitsiApi.dispose();
    jitsiApi = null;
  }

  activeMeetingId = meetingId;

  document.getElementById("meetingBox").classList.remove("hidden");
  document.getElementById("activeMeetingDisplay").innerText = meetingId;
  document.getElementById("jitsi-container").innerHTML = "";
  document.getElementById("speakStatus").innerText = "";

  try {
    jitsiApi = new JitsiMeetExternalAPI("meet.jit.si", {
      roomName: "ONEBODYINCHRIST-" + meetingId,
      parentNode: document.getElementById("jitsi-container"),
      width: "100%",
      height: 500,
      userInfo: {
        displayName: auth.currentUser.email || "Member"
      },
      configOverwrite: {
        prejoinPageEnabled: true
      }
    });
  } catch (e) {
    alert("Meeting could not open: " + e.message);
  }
}

async function shareMeeting() {
  const meetingId = document.getElementById("meetingIdDisplay").innerText;

  if (!meetingId) {
    alert("Please create a meeting first.");
    return;
  }

  const link = window.location.origin +
    window.location.pathname +
    "?meeting=" + encodeURIComponent(meetingId);

  const shareText =
    "Join my ONE BODY IN CHRIST meeting.\n" +
    "Meeting ID: " + meetingId + "\n" +
    "Meeting Link: " + link;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "ONE BODY IN CHRIST Meeting",
        text: shareText,
        url: link
      });
    } catch (e) {
      if (e.name !== "AbortError") {
        alert("Sharing failed. Please copy the link manually: " + link);
      }
    }
  } else {
    try {
      await navigator.clipboard.writeText(shareText);
      alert("Meeting link copied. You can share it on WhatsApp.");
    } catch (e) {
      prompt("Copy this meeting link:", link);
    }
  }
}

function closeMeeting() {
  if (jitsiApi) {
    jitsiApi.dispose();
    jitsiApi = null;
  }

  document.getElementById("jitsi-container").innerHTML = "";
  document.getElementById("meetingBox").classList.add("hidden");
  document.getElementById("speakStatus").innerText = "";
  activeMeetingId = "";
}

// PRAYER REQUEST

function showPrayer() {
  document.getElementById("prayerBox").classList.toggle("hidden");
}

async function sendPrayer() {
  const user = auth.currentUser;
  const message = document.getElementById("prayer").value.trim();
  const output = document.getElementById("prayerMessage");

  if (!user) {
    output.innerText = "Please login first.";
    return;
  }

  if (!message || message.length > 2000) {
    output.innerText = "Please enter a request (maximum 2000 characters).";
    return;
  }

  try {
    await db.collection("prayerRequests").add({
      message: message,
      status: "pending",
      userId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("prayer").value = "";
    output.innerText = "Your prayer request was sent successfully. God bless you!";
  } catch (e) {
    output.innerText = "Could not send request: " + e.message;
  }
}

async function loadRequests() {
  const area = document.getElementById("requests");
  area.textContent = "Loading prayer requests...";

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    area.textContent = "Admin access only.";
    return;
  }

  try {
    const snapshot = await db.collection("prayerRequests").get();
    area.replaceChildren();

    if (snapshot.empty) {
      area.textContent = "No prayer requests yet.";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement("div");
      card.className = "request";

      const message = document.createElement("p");
      message.textContent = data.message || "(No message)";
      card.appendChild(message);

      const status = document.createElement("p");
      status.className = "small";
      status.textContent = "Status: " + (data.status || "unknown");
      card.appendChild(status);

      const user = document.createElement("p");
      user.className = "small";
      user.textContent = "Member UID: " + (data.userId || "Not available");
      card.appendChild(user);

      if (data.status !== "prayed") {
        const btn = document.createElement("button");
        btn.textContent = "MARK AS PRAYED";
        btn.onclick = () => markPrayed(doc.id);
        card.appendChild(btn);
      }

      area.appendChild(card);
    });
  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}

async function markPrayed(id) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin access only.");
    return;
  }

  try {
    await db.collection("prayerRequests").doc(id).update({
      status: "prayed"
    });
    loadRequests();
  } catch (e) {
    alert("Could not update: " + e.message);
  }
}

// REQUEST TO SPEAK

async function requestToSpeak() {
  const user = auth.currentUser;
  const output = document.getElementById("speakStatus");

  if (!user) {
    output.innerText = "Please login first.";
    return;
  }

  output.innerText = "Sending your speaking request...";

  try {
    const ref = await db.collection("speakingRequests").add({
      userId: user.uid,
      userName: user.displayName || user.email || "Member",
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    if (speakingRequestUnsubscribe) {
      speakingRequestUnsubscribe();
    }

    output.innerText = "Your request has been sent. Waiting for approval.";

    speakingRequestUnsubscribe = db.collection("speakingRequests")
      .doc(ref.id)
      .onSnapshot(doc => {
        if (doc.exists) {
          const status = doc.data().status;

          if (status === "approved") {
            output.innerText = "Your speaking request has been APPROVED.";
          } else if (status === "denied") {
            output.innerText = "Your speaking request was DENIED.";
          } else {
            output.innerText = "Your speaking request is PENDING.";
          }
        }
      }, error => {
        output.innerText = "Status error: " + error.message;
      });
  } catch (e) {
    output.innerText = "Could not send request: " + e.message;
  }
}

// ADMIN AND HOST VIEW SPEAKING REQUESTS

async function loadSpeakingRequests() {
  const area = document.getElementById("speakingRequests");
  area.textContent = "Loading speaking requests...";

  if (!auth.currentUser || (!currentIsAdmin && !currentIsHost)) {
    area.textContent = "Admin or Host access only.";
    return;
  }

  try {
    const snapshot = await db.collection("speakingRequests").get();
    area.replaceChildren();

    if (snapshot.empty) {
      area.textContent = "No speaking requests yet.";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement("div");
      card.className = "request";

      const name = document.createElement("p");
      name.textContent = "Member: " + (data.userName || "Unknown");
      card.appendChild(name);

      const status = document.createElement("p");
      status.textContent = "Status: " + (data.status || "unknown");
      card.appendChild(status);

      const uid = document.createElement("p");
      uid.className = "small";
      uid.textContent = "Member UID: " + (data.userId || "Not available");
      card.appendChild(uid);

      if (data.status === "pending") {
        const approve = document.createElement("button");
        approve.textContent = "APPROVE";
        approve.onclick = () => setSpeakingStatus(doc.id, "approved");
        card.appendChild(approve);

        const deny = document.createElement("button");
        deny.textContent = "DENY";
        deny.onclick = () => setSpeakingStatus(doc.id, "denied");
        card.appendChild(deny);
      }

      area.appendChild(card);
    });
  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}

async function setSpeakingStatus(id, status) {
  if (!auth.currentUser || (!currentIsAdmin && !currentIsHost)) {
    alert("Admin or Host access only.");
    return;
  }

  if (status !== "approved" && status !== "denied") return;

  try {
    await db.collection("speakingRequests").doc(id).update({
      status: status
    });
    loadSpeakingRequests();
  } catch (e) {
    alert("Could not update request: " + e.message);
  }
}

// MAKE HOST

async function makeHost() {
  const user = auth.currentUser;
  const uid = document.getElementById("newHostUID").value.trim();
  const name = document.getElementById("newHostName").value.trim();
  const output = document.getElementById("hostMessage");

  if (!user || (!currentIsAdmin && !currentIsHost)) {
    output.innerText = "Admin or Host access only.";
    return;
  }

  if (!uid || !name) {
    output.innerText = "Please enter Member UID and Name.";
    return;
  }

  try {
    await db.collection("hosts").doc(uid).set({
      userId: uid,
      userName: name,
      role: "host",
      createdBy: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    output.innerText = "Member successfully made a HOST!";
    document.getElementById("newHostUID").value = "";
    document.getElementById("newHostName").value = "";
    loadHosts();
  } catch (e) {
    output.innerText = "Could not make Host: " + e.message;
  }
}

// VIEW HOSTS

async function loadHosts() {
  const area = document.getElementById("hostList");
  area.textContent = "Loading Hosts...";

  if (!auth.currentUser) {
    area.textContent = "Please login first.";
    return;
  }

  try {
    const snapshot = await db.collection("hosts").get();
    area.replaceChildren();

    if (snapshot.empty) {
      area.textContent = "No Hosts yet.";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement("div");
      card.className = "request";

      const name = document.createElement("p");
      name.textContent = "Host: " + (data.userName || "Unknown");
      card.appendChild(name);

      const uid = document.createElement("p");
      uid.className = "small";
      uid.textContent = "UID: " + doc.id;
      card.appendChild(uid);

      if (currentIsAdmin) {
        const remove = document.createElement("button");
        remove.textContent = "REMOVE HOST";
        remove.onclick = () => removeHost(doc.id);
        card.appendChild(remove);
      }

      area.appendChild(card);
    });
  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}

// REMOVE HOST - ADMIN ONLY

async function removeHost(uid) {
  if (!auth.currentUser || !currentIsAdmin) {
    alert("Only Admin can remove a Host.");
    return;
  }

  if (!confirm("Are you sure you want to remove this Host?")) return;

  try {
    await db.collection("hosts").doc(uid).delete();
    alert("Host removed successfully.");
    loadHosts();
  } catch (e) {
    alert("Could not remove Host: " + e.message);
  }
}

// LOGIN STATE AND ROLE CHECK

auth.onAuthStateChanged(async user => {
  document.getElementById("loginBox").classList.toggle("hidden", !!user);
  document.getElementById("dashboard").classList.toggle("hidden", !user);

  currentIsAdmin = false;
  currentIsHost = false;

  document.getElementById("adminBox").classList.add("hidden");
  document.getElementById("hostTools").classList.add("hidden");

  if (user) {
    document.getElementById("welcome").textContent = "Welcome, " + user.email;

    currentIsAdmin = user.uid === ADMIN_UID;

    if (!currentIsAdmin) {
      try {
        const hostDoc = await db.collection("hosts").doc(user.uid).get();
        currentIsHost = hostDoc.exists && hostDoc.data().role === "host";
      } catch (e) {
        console.error("Host check failed:", e);
      }
    }

    document.getElementById("adminBox").classList.toggle("hidden", !currentIsAdmin);

    document.getElementById("hostTools").classList.toggle(
      "hidden",
      !currentIsAdmin && !currentIsHost
    );

    // If user opened a shared meeting link, fill in its ID.
    const sharedMeetingId = new URLSearchParams(window.location.search)
      .get("meeting");

    if (sharedMeetingId && /^[A-Fa-f0-9]{12}$/.test(sharedMeetingId)) {
      document.getElementById("meetingIdInput").value =
        sharedMeetingId.toUpperCase();
    }

  } else {
    closeMeeting();
    document.getElementById("meetingBox").classList.add("hidden");
    document.getElementById("prayerBox").classList.add("hidden");
  }
});
</script>

</body>
</html>
